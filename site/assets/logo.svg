<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Shipvane">
  <g transform="scale(2.56)">
    <!-- Compass star: IDENTICAL geometry to the Vaneskald mark. This is the house
         element, so the two brands read as siblings. Blue is Shipvane's cool
         counterpart to Vaneskald's green; the gilt below is shared. -->
    <path d="M43.6 43.6 L50.0 3.0 L56.4 43.6 Z M56.4 43.6 L97.0 50.0 L56.4 56.4 Z M56.4 56.4 L50.0 97.0 L43.6 56.4 Z M43.6 56.4 L3.0 50.0 L43.6 43.6 Z M50.0 41.0 L69.8 30.2 L59.0 50.0 Z M59.0 50.0 L69.8 69.8 L50.0 59.0 Z M50.0 59.0 L30.2 69.8 L41.0 50.0 Z M41.0 50.0 L30.2 30.2 L50.0 41.0 Z" fill="#2E74B0"/>
  
    <!-- Burgee: the masthead wind vane, in the family gilt. Vaneskald flies a
         sail here. Same wind-striped flying surface, different instrument. -->
    <path d="M34 31 L90 46 L75 50 L90 54 L34 69 Z" fill="#E8B44A"/>
    <path d="M34 35.6 L78.5 47.4 L68 50 L78.5 52.6 L34 64.4 Z" fill="#0C2549" opacity=".78"/>
    <g fill="#7FC4F0">
      <path d="M34 37.9 h21.5 v2.1 h-21.5 z"/>
      <path d="M34 41.2 h33.0 v2.1 h-33.0 z"/>
      <path d="M34 44.5 h39.5 v2.1 h-39.5 z"/>
      <path d="M34 47.8 h32.5 v2.1 h-32.5 z"/>
      <path d="M34 51.3 h32.5 v2.1 h-32.5 z"/>
      <path d="M34 54.6 h38.5 v2.1 h-38.5 z"/>
      <path d="M34 57.9 h32.0 v2.1 h-32.0 z"/>
      <path d="M34 61.2 h20.5 v2.1 h-20.5 z"/>
    </g>
  
    <!-- Masthead: finial + the vane arrow that gives the brand its name -->
    <circle cx="33" cy="16.8" r="3.2" fill="#E8B44A"/>
    <path d="M36.4 14.2 L49 18.4 L36.4 22.6 Z" fill="#E8B44A"/>
  
    <!-- Mast: the steel spar, matching the weight and column of Vaneskald's blade -->
    <path d="M28.9 19.8 h8.2 v56.4 h-8.2 z" fill="#CFE9FB"/>
    <path d="M32.3 23 h1.4 v53 h-1.4 z" fill="#0C2549" opacity=".45"/>
    <!-- Crosstree, the counterpart to Vaneskald's crossguard -->
    <path d="M19 28.6 h18 v5.2 h-18 z" fill="#CFE9FB"/>
    <path d="M19 28.6 h18 v1.5 h-18 z" fill="#0C2549" opacity=".3"/>
  
    <!-- Hull -->
    <path d="M14 76.2 h72 q-1.6 10.4 -9.6 15.6 q-5.2 3.4 -12.4 3.4 h-28 q-7.2 0 -12.4 -3.4 q-8 -5.2 -9.6 -15.6 z" fill="#CFE9FB"/>
    <path d="M14 76.2 h72 q-0.3 2.0 -0.8 3.9 h-70.4 q-0.5 -1.9 -0.8 -3.9 z" fill="#0C2549" opacity=".45"/>
  </g>
</svg>
